# Docker Compose configuration for the application service.
services:
  app:
    # Build the app image from the local Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile
    # Map host port 8080 to container port 80.
    ports:
      - "8080:80"
    # Restart the container automatically if it stops.
    restart: unless-stopped
    # Environment variables available inside the container.
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    # Persist the local SQLite database file between container restarts.
    volumes:
      - ./backend/database:/var/www/html/database
