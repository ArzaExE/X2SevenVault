workflows:
  react-native-ios:
    name: React Native iOS Simulator
    max_build_duration: 60
    environment:
      xcode: 16.2
      node: 18
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd 5_Applicativo/X2SevenVault
          npm install --legacy-peer-deps

      - name: Expo Prebuild
        script: |
          cd 5_Applicativo/X2SevenVault
          npx expo prebuild --platform ios --clean

      - name: Fix Podfile per Firebase e deployment target
        script: |
          cd 5_Applicativo/X2SevenVault/ios
          sed -i '' '1s/^/use_modular_headers!\n/' Podfile
          python3 << PYEOF
          with open("Podfile", "r") as f:
              content = f.read()
          
          fix = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                if config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'].to_f < 13.0
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
                end
                if target.name == 'gRPC-C++'
                  config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17'
                end
              end
            end
          """
          content = content.replace("post_install do |installer|", "post_install do |installer|" + fix, 1)
          
          with open("Podfile", "w") as f:
              f.write(content)
          PYEOF

      - name: Install CocoaPods
        script: |
          cd 5_Applicativo/X2SevenVault/ios
          RCT_NEW_ARCH_ENABLED=1 pod install

      - name: Build iOS Simulator
        script: |
          cd 5_Applicativo/X2SevenVault
          xcodebuild \
            -workspace ios/X2SevenVault.xcworkspace \
            -scheme X2SevenVault \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log
          echo "=== ULTIMI 100 RIGHE LOG ==="
          tail -100 build.log

      - name: Zip e copia artifact
        script: |
          cd 5_Applicativo/X2SevenVault/build/Build/Products/Debug-iphonesimulator
          zip -r X2SevenVault.zip X2SevenVault.app
          cp X2SevenVault.zip $CM_BUILD_DIR/X2SevenVault.zip

    artifacts:
      - X2SevenVault.zip