workflows:
  react-native-ios:
    name: React Native iOS
    max_build_duration: 60
    environment:
      xcode: 16.2
      node: 18
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          cd 5_Applicativo/X2SevenVault
          npm install
      - name: Install CocoaPods
        script: |
          cd 5_Applicativo/X2SevenVault/ios && pod install
      - name: Build iOS
        script: |
          cd 5_Applicativo/X2SevenVault
          xcodebuild \
            -workspace ios/X2SevenVault.xcworkspace \
            -scheme X2SevenVault \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build
    artifacts:
      - 5_Applicativo/X2SevenVault/build/Build/Products/**/*.app