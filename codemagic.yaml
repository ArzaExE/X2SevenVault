workflows:
  react-native-ios:
    name: React Native iOS Simulator
    max_build_duration: 60
    environment:
      xcode: 16.2
      node: 18
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          cd 5_Applicativo/X2SevenVault
          npm install --legacy-peer-deps

      - name: Expo Prebuild
        script: |
          cd 5_Applicativo/X2SevenVault
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd 5_Applicativo/X2SevenVault/ios
          pod install

      - name: Build iOS Simulator
        script: |
          cd 5_Applicativo/X2SevenVault
          xcodebuild \
            -workspace ios/X2SevenVault.xcworkspace \
            -scheme X2SevenVault \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

    artifacts:
      - 5_Applicativo/X2SevenVault/build/Build/Products/Debug-iphonesimulator/X2SevenVault.app